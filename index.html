<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<title>山園小棧 ‧ 線上菜單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Long+Cang&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:       #1a1614;
    --ink-soft:  #4a3f37;
    --muted:     #8a7d72;
    --paper:     #f6efe1;
    --paper-2:   #ebe2d0;
    --paper-3:   #ddd0b8;
    --card:      #fdfaf2;
    --brick:     #a8332a;
    --brick-dk:  #7a1f18;
    --brick-lt:  #d2725f;
    --gold:      #b5894a;
    --line:      rgba(26,22,20,.12);
    --shadow:    0 1px 0 rgba(26,22,20,.04), 0 4px 14px -8px rgba(26,22,20,.18);
    --font-serif:  "Noto Serif TC", "Noto Serif JP", serif;
    --font-sans:   "Noto Sans TC", "Noto Sans JP", "Noto Sans KR", system-ui, sans-serif;
    --font-brush:  "Zhi Mang Xing", "Long Cang", "Noto Serif TC", cursive;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: #2a2520;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Phone frame — center 375px content on wider screens, full-bleed on phones */
  .phone {
    max-width: 375px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,.35);
  }

  /* ─── Top sticky language bar ──────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(26,22,20,.96);
    backdrop-filter: blur(8px);
    color: #f5ebd6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    border-bottom: 1px solid rgba(213,176,114,.25);
  }
  .topbar .mark {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 1px;
    color: #f5d690;
    display: flex; align-items: center; gap: 6px;
  }
  .topbar .mark::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--brick-lt);
    box-shadow: 0 0 0 2px rgba(213,176,114,.3);
  }
  .lang-switch {
    display: inline-flex;
    background: rgba(245,235,214,.08);
    border: 1px solid rgba(245,235,214,.2);
    border-radius: 999px;
    padding: 2px;
  }
  .lang-switch button {
    border: 0;
    background: transparent;
    color: #d9c79a;
    font: 600 11px var(--font-sans);
    padding: 5px 9px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: .5px;
  }
  .lang-switch button.on {
    background: #f5d690;
    color: #1a1614;
  }

  /* ─── Hero ─────────────────────────────────── */
  .hero {
    position: relative;
    height: 360px;
    overflow: hidden;
    background: #1a1614;
  }
  .hero img {
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .82;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(26,22,20,.05) 0%, rgba(26,22,20,.05) 45%, rgba(26,22,20,.85) 100%);
    z-index: 1;
  }
  .hero-stamp {
    position: absolute;
    top: 18px; right: 14px;
    width: 64px; height: 64px;
    border: 2px solid #f5d690;
    border-radius: 8px;
    transform: rotate(-6deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f5d690;
    background: rgba(168,51,42,.85);
    z-index: 2;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .hero-stamp .ch {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 2px;
  }
  .hero-stamp .yr {
    font: 800 13px var(--font-sans);
    letter-spacing: 1px;
  }
  .hero-title {
    position: absolute;
    left: 18px; right: 18px;
    bottom: 26px;
    z-index: 2;
    color: #fbf1d8;
  }
  .hero-title .zh-name {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 44px;
    line-height: 1;
    letter-spacing: 6px;
    text-shadow: 0 2px 16px rgba(0,0,0,.5);
  }
  .hero-title .sub {
    margin-top: 10px;
    font-family: var(--font-brush);
    font-size: 17px;
    color: #f5d690;
    opacity: .95;
    letter-spacing: 2px;
  }
  .hero-title .en {
    margin-top: 6px;
    font: 500 11px var(--font-sans);
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: .72;
  }

  /* ─── Info row ─────────────────────────────── */
  .info-strip {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .info-strip a, .info-strip .info-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 12px 6px;
    text-decoration: none;
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    border-right: 1px solid var(--line);
  }
  .info-strip > *:last-child { border-right: 0; }
  .info-strip .ic {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--brick);
  }
  .info-strip .sub {
    font-size: 10px; color: var(--muted); font-weight: 500;
  }

  /* ─── Address card ─────────────────────────── */
  .address {
    padding: 14px 18px 16px;
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(45deg, var(--paper-2) 0 2px, transparent 2px 8px);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border-bottom: 1px dashed var(--line);
  }
  .address .pin {
    width: 32px; height: 32px;
    flex: 0 0 32px;
    background: var(--brick);
    color: #f5d690;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .address .text {
    flex: 1;
    font-size: 13px;
    line-height: 1.55;
    color: var(--ink-soft);
  }

  /* ─── Announcement banner ──────────────────── */
  .announce {
    margin: 14px 14px 4px;
    background: #fffaee;
    border: 1px solid var(--paper-3);
    border-radius: 4px;
    position: relative;
  }
  .announce-h {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 6px;
    font: 700 13px var(--font-serif);
    color: var(--brick);
    letter-spacing: 2px;
  }
  .announce-h .stamp {
    background: var(--brick);
    color: #f5d690;
    font: 700 10px var(--font-sans);
    padding: 2px 7px;
    border-radius: 2px;
    letter-spacing: 1px;
  }
  .announce ul {
    margin: 0; padding: 4px 14px 12px 30px;
    list-style: none;
  }
  .announce li {
    position: relative;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .announce li::before {
    content: "‧";
    position: absolute;
    left: -14px;
    color: var(--brick);
    font-weight: 900;
  }

  /* ─── Category tabs (sticky) ───────────────── */
  .cat-tabs {
    position: sticky;
    top: 42px;
    z-index: 40;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    margin-top: 8px;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tabs .inner {
    display: inline-flex;
    padding: 0 12px;
    gap: 2px;
    white-space: nowrap;
  }
  .cat-tabs button {
    border: 0;
    background: transparent;
    padding: 12px 12px 10px;
    font: 600 13px var(--font-sans);
    color: var(--muted);
    cursor: pointer;
    position: relative;
    letter-spacing: 1px;
  }
  .cat-tabs button.on {
    color: var(--brick);
  }
  .cat-tabs button.on::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px;
    bottom: 0;
    height: 2px;
    background: var(--brick);
    border-radius: 2px;
  }

  /* ─── Category section heading ─────────────── */
  .cat-section {
    padding: 16px 14px 4px;
    scroll-margin-top: 90px;
  }
  .cat-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 10px;
    padding: 4px 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .cat-head .zh {
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: 4px;
  }
  .cat-head .sub {
    font: 500 11px var(--font-sans);
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .cat-head .count {
    margin-left: auto;
    font: 700 11px var(--font-sans);
    color: var(--brick);
    background: rgba(168,51,42,.08);
    padding: 3px 8px;
    border-radius: 999px;
  }

  /* ─── Item card ────────────────────────────── */
  .item {
    display: grid;
    grid-template-columns: 84px 1fr auto;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px dotted var(--line);
    cursor: pointer;
    align-items: center;
  }
  .item:active {
    background: rgba(168,51,42,.04);
  }
  .item-img {
    width: 84px; height: 84px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--paper-2);
    position: relative;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .item-img img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .item-img .emoji {
    font-size: 38px;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,.08));
  }
  .item-img .ribbon {
    position: absolute;
    top: 0; left: 0;
    background: var(--brick);
    color: #f5d690;
    font: 700 9px var(--font-sans);
    padding: 2px 6px;
    border-bottom-right-radius: 6px;
    letter-spacing: 1px;
  }
  .item-body { min-width: 0; }
  .item-name {
    font: 700 16px var(--font-sans);
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 4px;
    overflow-wrap: break-word;
  }
  .item-note {
    font: 500 11px var(--font-sans);
    color: var(--muted);
    line-height: 1.3;
    margin-bottom: 5px;
  }
  .item-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 3px;
    font: 600 10px var(--font-sans);
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--paper-2);
    color: var(--ink-soft);
    line-height: 1;
  }
  .tag.r { background: rgba(168,51,42,.1); color: var(--brick); }
  .tag.s { background: rgba(229,116,49,.12); color: #b25323; }
  .tag.meat { background: rgba(120,82,52,.1); color: #7a5234; }
  .tag.v { background: rgba(76,124,55,.12); color: #4a7232; }
  .tag .ic { font-size: 11px; }

  .item-price {
    text-align: right;
    align-self: center;
    min-width: 56px;
  }
  .price-currency { font: 600 10px var(--font-sans); color: var(--muted); }
  .price-value {
    font: 900 22px var(--font-serif);
    color: var(--brick);
    line-height: 1;
    letter-spacing: -.5px;
  }
  .price-multi {
    text-align: right;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .price-multi .row {
    display: flex; justify-content: space-between; gap: 8px;
    margin-bottom: 2px;
  }
  .price-multi .row .lab { color: var(--muted); font-weight: 500; }
  .price-multi .row .val { color: var(--brick); font-weight: 800; font-family: var(--font-serif); }

  /* ─── Wall calligraphy strip ───────────────── */
  .wall-strip {
    margin: 20px 14px;
    height: 92px;
    background-image: url("images/interior-wall.png");
    background-size: cover;
    background-position: center;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }
  .wall-strip::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(246,239,225,.05), rgba(246,239,225,.55));
  }
  .wall-strip .quote {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    font-family: var(--font-brush);
    color: var(--ink);
    font-size: 20px;
    line-height: 1.3;
    text-align: right;
    letter-spacing: 2px;
    max-width: 60%;
  }
  .wall-strip .quote em {
    display: block;
    font: 500 10px var(--font-sans);
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 1px;
    font-style: normal;
  }

  /* ─── Footer ───────────────────────────────── */
  .footer {
    background: #1a1614;
    color: #d9c79a;
    padding: 28px 18px 36px;
    text-align: center;
  }
  .footer .seal {
    width: 56px; height: 56px;
    margin: 0 auto 12px;
    border: 2px solid #b5894a;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif);
    font-weight: 900;
    font-size: 22px;
    color: #f5d690;
    letter-spacing: 1px;
    transform: rotate(-3deg);
  }
  .footer .thanks {
    font-family: var(--font-serif);
    font-size: 16px;
    margin-bottom: 8px;
    letter-spacing: 3px;
  }
  .footer .addr {
    font-size: 11px;
    line-height: 1.6;
    opacity: .7;
    margin-bottom: 4px;
  }

  /* ─── Modal ────────────────────────────────── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    position: fixed;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    bottom: 0;
    width: 100%;
    max-width: 375px;
    max-height: 92vh;
    background: var(--paper);
    z-index: 101;
    border-radius: 16px 16px 0 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 -8px 32px rgba(0,0,0,.3);
  }
  .modal.show {
    transform: translateX(-50%) translateY(0);
  }
  .modal-close {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 3;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    border: 0;
    font-size: 18px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    display: flex; align-items: center; justify-content: center;
  }
  .modal .m-img {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: var(--paper-2);
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
    touch-action: pinch-zoom;
    -webkit-overflow-scrolling: touch;
  }
  .modal .m-img img {
    width: 100%; height: 100%; object-fit: cover;
    touch-action: pinch-zoom;
  }
  .modal .m-img .emoji-big {
    font-size: 120px;
  }
  .modal .m-body {
    padding: 20px 18px 28px;
  }
  .modal .m-cat {
    font: 600 11px var(--font-sans);
    color: var(--brick);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .modal .m-name {
    font: 900 24px var(--font-serif);
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .modal .m-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .modal .m-tags .tag { font-size: 11px; padding: 4px 8px; }
  .modal .m-price-block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  .modal .m-price-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4px 0;
  }
  .modal .m-price-row + .m-price-row {
    border-top: 1px dashed var(--line);
    padding-top: 8px; margin-top: 4px;
  }
  .modal .m-price-row .lab {
    font: 600 13px var(--font-sans);
    color: var(--ink-soft);
  }
  .modal .m-price-row .val {
    font: 900 22px var(--font-serif);
    color: var(--brick);
  }
  .modal .m-section {
    margin-top: 14px;
  }
  .modal .m-section-h {
    font: 700 11px var(--font-sans);
    color: var(--muted);
    letter-spacing: 3px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .modal .m-section-body {
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .modal .m-section-body p {
    margin: 0 0 4px;
  }

  /* iOS safe area */
  @supports (padding: max(0px)) {
    .modal { padding-bottom: env(safe-area-inset-bottom); }
    .footer { padding-bottom: max(36px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Top sticky bar -->
  <div class="topbar">
    <div class="mark" data-i18n="storeName">山園小棧</div>
    <div class="lang-switch">
      <button data-lang="zh" class="on">繁中</button>
      <button data-lang="en">EN</button>
      <button data-lang="ja">日本</button>
      <button data-lang="ko">한국</button>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero">
    <img src="images/storefront-hero.png" alt="山園小棧 店面">
    <div class="hero-stamp">
      <div class="ch">埔里</div>
      <div class="yr">EST</div>
    </div>
    <div class="hero-title">
      <div class="zh-name" data-i18n="storeName">山園小棧</div>
      <div class="sub" data-i18n="storeSub">一碗白飯  一碗麵</div>
      <div class="en">PULI ‧ NANTOU ‧ TAIWAN</div>
    </div>
  </header>

  <!-- Quick info -->
  <div class="info-strip">
    <a href="tel:0910572658">
      <span class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </span>
      <span data-i18n="callBtn">撥打電話</span>
      <span class="sub" data-i18n="phone">0910-572-658</span>
    </a>
    <a href="https://maps.google.com/?q=545南投縣埔里鎮桃米里桃米路33之1號" target="_blank">
      <span class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
      <span data-i18n="mapBtn">地圖導航</span>
      <span class="sub">桃米路 33-1</span>
    </a>
    <div class="info-cell">
      <span class="ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </span>
      <span data-i18n="hoursBtn">營業時間</span>
      <span class="sub" data-i18n="hoursValue">每日 10:30–19:30</span>
    </div>
  </div>

  <!-- Address -->
  <div class="address">
    <div class="pin">📍</div>
    <div class="text" data-i18n="address">545南投縣埔里鎮桃米里桃米路33之1號</div>
  </div>

  <!-- Announcement -->
  <div class="announce">
    <div class="announce-h">
      <span class="stamp" data-i18n="announce">店家公告</span>
    </div>
    <ul>
      <li data-i18n="notice1">櫃台備有辣醬與辣炒蘿蔔乾,可自行取用</li>
      <li data-i18n="notice2">外送服務請提前一天預訂</li>
      <li data-i18n="notice3">禁帶外食、禁帶酒</li>
      <li data-i18n="notice4">內用每人最低消費 NT$80</li>
    </ul>
  </div>

  <!-- Category tabs -->
  <nav class="cat-tabs" id="catTabs">
    <div class="inner" id="catTabsInner"></div>
  </nav>

  <!-- Menu sections rendered here -->
  <main id="menuMain"></main>

  <!-- Wall calligraphy quote -->
  <div class="wall-strip">
    <div class="quote">
      一碗白飯<br>一碗麵
      <em data-i18n="storeSub">A bowl of rice, a bowl of noodles</em>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="seal">山</div>
    <div class="thanks" data-i18n="footer">謝謝光臨</div>
    <div class="addr" data-i18n="address">545南投縣埔里鎮桃米里桃米路33之1號</div>
    <div class="addr" data-i18n="phone">0910-572-658</div>
  </footer>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop"></div>
<aside class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
  <div class="m-img" id="mImg"></div>
  <div class="m-body">
    <div class="m-cat" id="mCat"></div>
    <h2 class="m-name" id="mName"></h2>
    <div class="m-tags" id="mTags"></div>
    <div class="m-price-block" id="mPriceBlock"></div>
    <div class="m-section" id="mDescSection" style="display:none">
      <div class="m-section-h" data-i18n="desc">說明</div>
      <div class="m-section-body" id="mDesc"></div>
    </div>
    <div class="m-section" id="mNoteSection" style="display:none">
      <div class="m-section-h" data-i18n="noteLabel">備註</div>
      <div class="m-section-body" id="mNote"></div>
    </div>
  </div>
</aside>

<script src="data/menu-items.js"></script>
<script>
(function() {
  'use strict';

  let currentLang = localStorage.getItem('lang') || 'zh';
  const { menuItems, i18n } = window;

  // ───────── Language switching ─────────
  function applyLang(lang) {
    currentLang = lang;
    localStorage.setItem('lang', lang);
    document.documentElement.lang =
      ({ zh: 'zh-Hant', en: 'en', ja: 'ja', ko: 'ko' })[lang];

    // Top nav buttons
    document.querySelectorAll('.lang-switch button').forEach(b => {
      b.classList.toggle('on', b.dataset.lang === lang);
    });

    // Simple i18n nodes
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (i18n.ui[key] && i18n.ui[key][lang]) {
        el.textContent = i18n.ui[key][lang];
      }
    });

    renderCategoryTabs();
    renderMenu();
  }

  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.addEventListener('click', () => applyLang(b.dataset.lang));
  });

  // ───────── Helpers ─────────
  function fmtPrice(v) {
    if (v === 'market') return i18n.ui.market[currentLang];
    return 'NT$' + v;
  }
  function tagClass(code) {
    if (code === 'R') return 'tag r';
    if (['1','2','3'].includes(code)) return 'tag s';
    if (['P','B','L'].includes(code)) return 'tag meat';
    if (['V','V5','H'].includes(code)) return 'tag v';
    return 'tag';
  }
  function renderTags(tags, full=false) {
    if (!tags || !tags.length) return '';
    return tags.map(c => {
      const t = i18n.tags[c]; if (!t) return '';
      const label = full ? `<span class="lb">${t[currentLang]}</span>` : '';
      return `<span class="${tagClass(c)}"><span class="ic">${t.icon}</span>${label || (full ? '' : t[currentLang])}</span>`;
    }).join('');
  }

  // ───────── Tabs ─────────
  function renderCategoryTabs() {
    const inner = document.getElementById('catTabsInner');
    inner.innerHTML = i18n.categoryOrder.map(cat => {
      return `<button data-cat="${cat}">${i18n.categories[cat][currentLang]}</button>`;
    }).join('');
    inner.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const tgt = document.getElementById('sec-' + btn.dataset.cat);
        if (tgt) {
          const topbar = document.querySelector('.topbar').offsetHeight;
          const tabs = document.querySelector('.cat-tabs').offsetHeight;
          window.scrollTo({
            top: tgt.getBoundingClientRect().top + window.scrollY - (topbar + tabs + 8),
            behavior: 'smooth'
          });
        }
      });
    });
    // mark initial active
    if (inner.firstChild) inner.firstChild.classList.add('on');
  }

  // ───────── Menu render ─────────
  function renderMenu() {
    const main = document.getElementById('menuMain');
    main.innerHTML = i18n.categoryOrder.map(cat => {
      const items = menuItems.filter(i => i.category === cat);
      if (!items.length) return '';
      const meta = i18n.categories[cat];
      const subLang = currentLang === 'zh' ? 'en' : 'zh';
      return `
        <section class="cat-section" id="sec-${cat}">
          <div class="cat-head">
            <span class="zh">${meta[currentLang]}</span>
            <span class="sub">${meta[subLang]}</span>
            <span class="count">${items.length}</span>
          </div>
          ${items.map(renderItem).join('')}
        </section>
      `;
    }).join('');

    main.querySelectorAll('.item').forEach((el, idx) => {
      el.addEventListener('click', () => {
        const id = el.dataset.id;
        const item = menuItems.find(i => i.id === id);
        if (item) openModal(item);
      });
    });
  }

  function renderItem(item) {
    const price = renderItemPrice(item);
    const tags = renderTags(item.tags);
    const note = item.note[currentLang];
    const imgBlock = item.image
      ? `<img src="images/${item.image}" alt="${item.names[currentLang]}" loading="lazy">`
      : `<span class="emoji">${item.emoji || '🍽️'}</span>`;
    const ribbon = item.tags && item.tags.includes('R')
      ? `<span class="ribbon">${i18n.tags.R.icon}</span>` : '';
    return `
      <div class="item" data-id="${item.id}">
        <div class="item-img">${imgBlock}${ribbon}</div>
        <div class="item-body">
          <div class="item-name">${item.names[currentLang]}</div>
          ${note ? `<div class="item-note">${note.split(';').join(' · ')}</div>` : ''}
          ${tags ? `<div class="item-tags">${tags}</div>` : ''}
        </div>
        <div class="item-price">${price}</div>
      </div>
    `;
  }

  function renderItemPrice(item) {
    const p = item.price;
    if (p.length === 1 && !p[0].label) {
      const v = p[0].value;
      if (v === 'market') return `<div class="price-value" style="font-size:14px">${i18n.ui.market[currentLang]}</div>`;
      return `<span class="price-currency">NT$</span><span class="price-value">${v}</span>`;
    }
    return `<div class="price-multi">${
      p.map(opt => `<div class="row"><span class="lab">${opt.label ? opt.label[currentLang] : ''}</span><span class="val">${fmtPrice(opt.value)}</span></div>`).join('')
    }</div>`;
  }

  // ───────── Modal ─────────
  let savedScroll = 0;
  function openModal(item) {
    savedScroll = window.scrollY;
    const modal = document.getElementById('modal');
    const backdrop = document.getElementById('modalBackdrop');

    document.getElementById('mCat').textContent =
      i18n.categories[item.category][currentLang];
    document.getElementById('mName').textContent = item.names[currentLang];

    // Image
    const mImg = document.getElementById('mImg');
    if (item.image) {
      mImg.innerHTML = `<img src="images/${item.image}" alt="${item.names[currentLang]}">`;
    } else {
      mImg.innerHTML = `<span class="emoji-big">${item.emoji || '🍽️'}</span>`;
    }

    // Tags
    const mTags = document.getElementById('mTags');
    if (item.tags && item.tags.length) {
      mTags.innerHTML = item.tags.map(c => {
        const t = i18n.tags[c]; if (!t) return '';
        return `<span class="${tagClass(c)}"><span class="ic">${t.icon}</span>${t[currentLang]}</span>`;
      }).join('');
      mTags.style.display = '';
    } else {
      mTags.style.display = 'none';
    }

    // Prices
    const pb = document.getElementById('mPriceBlock');
    pb.innerHTML = item.price.map(opt => {
      const lab = opt.label ? opt.label[currentLang] : i18n.ui.hoursTitle ? '' : '';
      const labText = opt.label ? opt.label[currentLang] : (item.price.length === 1 ? '價格' : '');
      const labMap = {
        zh: opt.label ? opt.label.zh : '單一價格',
        en: opt.label ? opt.label.en : 'Price',
        ja: opt.label ? opt.label.ja : '価格',
        ko: opt.label ? opt.label.ko : '가격',
      };
      const v = opt.value === 'market' ? i18n.ui.market[currentLang] : ('NT$' + opt.value);
      return `<div class="m-price-row"><span class="lab">${labMap[currentLang]}</span><span class="val">${v}</span></div>`;
    }).join('');

    // Desc
    const desc = item.desc[currentLang];
    const ds = document.getElementById('mDescSection');
    if (desc && desc.trim()) {
      document.getElementById('mDesc').textContent = desc;
      ds.style.display = '';
    } else { ds.style.display = 'none'; }

    // Note
    const note = item.note[currentLang];
    const ns = document.getElementById('mNoteSection');
    if (note && note.trim()) {
      const lines = note.split(';').map(s => `<p>${s.trim()}</p>`).join('');
      document.getElementById('mNote').innerHTML = lines;
      ns.style.display = '';
    } else { ns.style.display = 'none'; }

    backdrop.classList.add('show');
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
    document.getElementById('modalBackdrop').classList.remove('show');
    document.body.style.overflow = '';
    window.scrollTo({ top: savedScroll });
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', closeModal);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // ───────── Scroll spy for tabs ─────────
  function setupScrollSpy() {
    const sections = [...document.querySelectorAll('.cat-section')];
    const tabs = document.getElementById('catTabsInner');
    function update() {
      const topbar = document.querySelector('.topbar').offsetHeight;
      const tabsH = document.querySelector('.cat-tabs').offsetHeight;
      const probe = topbar + tabsH + 20;
      let active = sections[0];
      for (const s of sections) {
        if (s.getBoundingClientRect().top - probe <= 0) active = s;
        else break;
      }
      const id = active.id.replace('sec-', '');
      tabs.querySelectorAll('button').forEach(btn => {
        const on = btn.dataset.cat === id;
        btn.classList.toggle('on', on);
        if (on) {
          // scroll tab into view
          const r = btn.getBoundingClientRect();
          const cr = tabs.parentElement.getBoundingClientRect();
          if (r.left < cr.left + 20 || r.right > cr.right - 20) {
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          }
        }
      });
    }
    window.addEventListener('scroll', update, { passive: true });
    update();
  }

  // ───────── Boot ─────────
  applyLang(currentLang);
  setupScrollSpy();
})();
</script>

</body>
</html>
